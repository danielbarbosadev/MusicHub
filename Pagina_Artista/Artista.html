<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicHub - Zendaya</title>
    <link rel="stylesheet" href="Artista.css">
    <link rel="stylesheet" href="/style/global.css">
    <link rel="shortcut icon" href="/imgs/icone-musichub-branco.svg" type="image/x-icon">

</head>

<body>
    <header class="cabecalho">
        <img src="/imgs/logo-musichub-preta-horizontal.svg" alt="logotipo do site">
        <img src="/imgs/perfil-tom-holland.svg" alt="foto de perfil do usuário">
    </header>
    <main>
        <div class="Artista">
            <img src="/imgs/zendaya.jpg" alt="icone do artista da página">
            <h3>Zendaya</h3>
            <p>8.367.000 ouvintes mensais</p>
            <button class="btn-seguir">Seguir</button>
        </div>

        <div class="musicas-mais-tocadas">
            <h2>Músicas mais tocadas</h2>

            <ol class="lista-musicas">

                <li>
                    <div class="faixa-musical">
                        <img src="/imgs/faixa-musical.jpg" alt="Capa de Rewrite The Stars">
                        <p class="nome-musica">Rewrite The Stars</p>
                        <p class="reproducoes">675.190.723</p>
                        <p class="duracao">3:37</p>
                    </div>
                </li>

                <li>
                    <div class="faixa-musical">
                        <img src="/imgs/faixa-musical.jpg" alt="Capa de All For Us">
                        <p class="nome-musica">All For Us</p>
                        <p class="reproducoes">455.324.123</p>
                        <p class="duracao">3:11</p>
                    </div>
                </li>

                <li>
                    <div class="faixa-musical">
                        <img src="/imgs/faixa-musical.jpg" alt="Capa de The Greatest Show">
                        <p class="nome-musica">The Greatest Show</p>
                        <p class="reproducoes">233.612.984</p>
                        <p class="duracao">5:02</p>
                    </div>
                </li>

                <li>
                    <div class="faixa-musical">
                        <img src="/imgs/faixa-musical.jpg" alt="Capa de The Greatest Show">
                        <p class="nome-musica">Replay</p>
                        <p class="reproducoes">187.324.024</p>
                        <p class="duracao">3:29</p>
                    </div>
                </li>

                <li>
                    <div class="faixa-musical">
                        <img src="/imgs/faixa-musical.jpg" alt="Capa de The Greatest Show">
                        <p class="nome-musica">Come Alive</p>
                        <p class="reproducoes">67.324.645</p>
                        <p class="duracao">3:45</p>
                    </div>
                </li>

            </ol>

            <button class="bnt-ver-mais">Ver mais</button>
        </div>
        <div class="discografia"></div>
    </main>
</body>

</html>
