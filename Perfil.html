<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicHub - Perfil</title>
    <link rel="shortcut icon" href="imgs/icone-musichub-branco.svg" type="image/x-icon">
    <link rel="stylesheet" href="style/global.css">
    <link rel="stylesheet" href="Perfil.css">
    <script src="https://kit.fontawesome.com/e1a4ea105f.js" crossorigin="anonymous"></script>
</head>

<body>
    <header class="cabecalho">
        <img src="imgs/logo-musichub-preta-horizontal.svg" alt="Logo do MusicHub">
        <img src="imgs/perfil-tom-holland.svg" alt="Foto de perfil de usuário">
    </header>
    <main>
        <div class="perfil">
            <div class="perfil-imagem">
                <img src="imgs/perfil-tom-holland.svg" alt="Foto de perfil de usuário">
                <div class="informacao">
                    <h4>Tom Holland</h4>
                    <p>Spiderboy@gmail.com</p>
                    <div class="estatisticas">
                        <a href="">4 Playlist</a>
                        <p>•</p>
                        <a href="">67K Seguidores</a>
                        <p>•</p>
                        <a href="">1 Seguindo</a>
                    </div>
                </div>
            </div>
            <div class="configuracao">
                <i class="fa-solid fa-gear"></i>
                <i class="fa-solid fa-ellipsis"></i>
            </div>
        </div>
        <h2>Minhas playlists</h2>
        <div class="playlist">
            <div class="album">
                <img src="imgs/album-1.svg" alt="">
                <h3>Playlist 1</h3>
                <p>48 Músicas</p>
            </div>
            <div class="album">
                <img src="imgs/album-2.svg" alt="">
                <h3>Playlist 2</h3>
                <p>57 Músicas</p>
            </div>
            <div class="album">
                <img src="imgs/album-3.svg" alt="">
                <h3>Playlist 3</h3>
                <p>23 Músicas</p>
            </div>
            <div class="album">
                <img src="imgs/album-4.svg" alt="">
                <h3>Playlist 4</h3>
                <p>34 Músicas</p>
            </div>
        </div>
        <h2>Artistas mais ouvidos</h2>
        <div class="artistas">
            <div class="artista">
                
            </div>
        </div>
    </main>
</body>

</html>
