<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS -->
    <link rel="stylesheet" href="../passo1/style.css">
    <link rel="stylesheet" href="../../style/global.css">

    <!-- Favicon -->
    <link rel="shortcut icon" href="../../imgs/icone-musichub-branco.svg" type="image/x-icon">

    <title>Cadastrar</title>
</head>

<body>
    <header class="cabecalho">
        <img src="../../imgs/logo-musichub-preta-horizontal.svg" alt="Logo horizontal preta do MusicHub">
        <a href="../../login/index.html" class="btn-entrar-login">Entrar</a>
    </header>
    <main class="conteudo">
        <section class="login">
            <div class="titulo-login">
                <div class="progresso-login">
                    <span class="barra-progresso"></span>
                    <span class="barra-progresso porcentagem"></span>
                    <p>Passo 1 de 2</p>
                </div>
                <h1>Boas-vindas às suas músicas favoritas</h1>~
                <p>Crie sua conta e comece a ouvir o que você ama.</p>
            </div>
            <form action="">
                <article class="sessao-input">
                    <label for="email">E-mail</label>
                    <div class="campo-icone-input">
                        <input type="email" name="" id="email" placeholder="seuemail@gmail.com">
                        <img src="../../imgs/icone-email.svg" alt="Ícone de carta">
                    </div>
                </article>

                <article class="sessao-input">
                    <label for="senha">Senha</label>
                    <div class="campo-icone-input">
                        <input type="password" name="" id="senha" placeholder="Digite sua senha">
                        <img src="../../imgs/icone-olho.svg" alt="Ícone de olho">
                    </div>
                </article>

                <button class="btn-confirmar">Confirmar</button>

                <span class="entrar-com">
                    <span class="linha"></span>
                    <p>Ou entre com</p>
                    <span class="linha"></span>
                </span>

                <div class="sessao-entrar-alternativa">
                    <article class="btn-entrar-alternativa">
                        <img src="../../imgs/icon-google.svg" alt="Ícone logo Google">
                    </article>
                    <article class="btn-entrar-alternativa">
                        <img src="../../imgs/icon-telefone.svg" alt="Ícone de telefone">
                    </article>
                    <article class="btn-entrar-alternativa">
                        <img src="../../imgs/icon-facebook.svg" alt="Ícone logo Facebook">
                    </article>
                </div>
            </form>
        </section>
    </main>
</body>

</html>
